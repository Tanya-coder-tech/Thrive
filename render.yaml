services:
  - type: web
    name: thrive-shared-expense-receipt-portal
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT "render_app:create_render_app()"
    autoDeployTrigger: commit
    healthCheckPath: /
    disk:
      name: thrive-data
      mountPath: /opt/render/project/src/instance/workspace
      sizeGB: 1
    envVars:
      - key: THRIVE_HTTPS
        value: "1"
      - key: THRIVE_SECRET_KEY
        generateValue: true
